<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Zain Ul Abdin</title>
  <meta name="description" content="Get in touch with Zain Ul Abdin about internships and frontend projects.">
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container nav">
      <a class="logo" href="index.html">&gt;_  Zain Ul Abdin</a>
      <nav aria-label="Main">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
      <button type="button" id="theme-toggle" class="btn btn-outline">Switch theme</button>
    </div>
  </header>

  <main id="main" class="container">
    <section class="section" aria-labelledby="contact-title">
      <h1 id="contact-title">Contact</h1>

      <p id="form-success" class="success" role="status" hidden>Thanks! Your message was sent. I will reply soon.</p>

      <div class="contact-content">
        <form id="contact-form" action="#" method="post">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required minlength="3" autocomplete="name" aria-describedby="name-error">
            <p class="error" id="name-error" hidden></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" aria-describedby="email-error">
            <p class="error" id="email-error" hidden></p>
          </div>

          <div class="field">
            <label for="subject">Subject</label>
            <select id="subject" name="subject" required aria-describedby="subject-error">
              <option value="">Choose a subject</option>
              <option value="internship">Internship opportunity</option>
              <option value="project">Project collaboration</option>
              <option value="feedback">Feedback</option>
              <option value="other">Other</option>
            </select>
            <p class="error" id="subject-error" hidden></p>
          </div>

          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required minlength="20" aria-describedby="message-error"></textarea>
            <p class="error" id="message-error" hidden></p>
          </div>

          <fieldset>
            <legend>How did you hear about me?</legend>
            <label class="inline"><input type="radio" name="source" value="linkedin" checked> LinkedIn</label>
            <label class="inline"><input type="radio" name="source" value="github"> GitHub</label>
            <label class="inline"><input type="radio" name="source" value="friend"> A friend</label>
          </fieldset>

          <div class="field">
            <label class="inline"><input type="checkbox" id="consent" name="consent" required aria-describedby="consent-error"> I agree to be contacted about this message</label>
            <p class="error" id="consent-error" hidden></p>
          </div>

          <button type="submit" class="btn">Send message</button>
        </form>
        <img class="contact-illustration" src="public/contact.gif" width="480" height="360" alt="">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026  Zain Ul Abdin</p>
      <ul class="nav-links">
       <li><a href="https://github.com/zainshafique77-hash">GitHub</a></li>
        <li><a href="https://www.linkedin.com/in/zain-ul-abdin-677ab3425/">LinkedIn</a></li>
        <li><a href="mailto:zainshafique77@gmail.com">Email</a></li>
      </ul>
    </div>
  </footer>

  <script src="js/contact.js" defer></script>
</body>
</html>
